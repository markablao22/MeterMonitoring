name: Build MeterMonitoring Android packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK and release Android App Bundle
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: MeterMonitoring-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release AAB draft (unsigned until upload key is configured)
        uses: actions/upload-artifact@v4
        with:
          name: MeterMonitoring-release-aab-draft
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
